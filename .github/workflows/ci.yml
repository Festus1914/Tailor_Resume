name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: test-key
          MONGODB_URI: mongodb://test
          SESSION_SECRET: test-secret-32-bytes-long-secure
          ADMIN_EMAIL: test@example.com

      - name: Run tests
        run: npm test -- --run
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run security checks
        run: |
          # Check for exposed API keys
          if grep -r "sk-ant-" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . | \
            grep -v ".env.example" | grep -v "SECURITY.md"; then
            echo "⚠️  Found potential API keys in code"
            exit 1
          fi

          # Check for hardcoded MongoDB URIs
          if grep -r "mongodb" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . | \
            grep -v ".env.example" | grep -v "SECURITY.md" | grep -v "lib/mongodb.ts"; then
            echo "⚠️  Found potential hardcoded MongoDB URIs"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: npm run lint || true
